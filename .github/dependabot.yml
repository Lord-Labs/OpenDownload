version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint cannot load the TypeScript 7 compiler API yet.
      - dependency-name: typescript
        versions: [">=7"]
      # Keep Node declarations aligned with the Node 24 deployment runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: gomod
    directory: /services/api
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
